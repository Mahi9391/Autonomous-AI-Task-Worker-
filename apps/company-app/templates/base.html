<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Internal Financial ERP{% endblock %} — CentrAlign Company App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --badge-bg: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #020617;
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: var(--accent); }
    nav {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    nav a:hover, nav a.active { color: #fff; }
    
    /* Dev Bar */
    .dev-control-bar {
      background: #1e1b4b;
      border-bottom: 1px solid #3730a3;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      color: #c7d2fe;
    }
    .dev-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .dev-badge {
      background: #4338ca;
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
    }
    .dev-controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .dev-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: var(--danger); color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      text-align: left;
    }
    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    th {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-unpaid { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-paid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-overdue { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Header -->
  <header>
    <div class="top-bar">
      <a href="/invoices" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        CentrAlign <span>ERP</span>
      </a>
      <nav>
        <a href="/invoices" id="nav-invoices">Invoices</a>
        <a href="/vendors" id="nav-vendors">Vendors</a>
        <a href="/invoices/new" id="nav-new-invoice" class="btn btn-primary" style="padding: 0.4rem 0.8rem;">+ Enter Invoice</a>
      </nav>
    </div>
  </header>

  <!-- Interactive Dev & Fault Control Bar -->
  <div class="dev-control-bar">
    <div class="dev-container">
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <span class="dev-badge">Simulated Company App</span>
        <span>Port 8001 | Status: Online</span>
      </div>
      <div class="dev-controls">
        <label class="dev-toggle" title="Toggle UI perturbation to demonstrate agent resilience">
          <input type="checkbox" id="toggle-perturbation" {% if perturbation_enabled %}checked{% endif %} onchange="updatePerturbation(this.checked)">
          <span>UI Perturbation: <strong id="perturbation-status">{% if perturbation_enabled %}ENABLED{% else %}OFF{% endif %}</strong></span>
        </label>
        <div style="display:flex; align-items:center; gap:0.4rem;">
          <span>Fault Mode:</span>
          <select id="fault-mode-select" onchange="updateFaultMode(this.value)" style="width:auto; padding:0.2rem 0.5rem; font-size:0.8rem;">
            <option value="none" {% if fault_mode == 'none' %}selected{% endif %}>None (Normal)</option>
            <option value="fail_before_save" {% if fault_mode == 'fail_before_save' %}selected{% endif %}>Fail Before Save (HTTP 500)</option>
            <option value="fail_after_save" {% if fault_mode == 'fail_after_save' %}selected{% endif %}>Fail After Save (HTTP 504)</option>
            <option value="timeout" {% if fault_mode == 'timeout' %}selected{% endif %}>Timeout (15s delay)</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="resetSeedData()" style="padding:0.2rem 0.5rem; font-size:0.75rem;">Reset Data</button>
      </div>
    </div>
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    async function updatePerturbation(enabled) {
      await fetch('/api/toggle-perturbation', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ enabled })
      });
      document.getElementById('perturbation-status').innerText = enabled ? 'ENABLED' : 'OFF';
      window.location.reload();
    }
    async function updateFaultMode(mode) {
      await fetch('/api/set-fault-mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode })
      });
    }
    async function resetSeedData() {
      if (confirm('Reset database to initial seed state?')) {
        await fetch('/api/reset-data', { method: 'POST' });
        window.location.reload();
      }
    }
  </script>
</body>
</html>
