<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Secure Mail Sandbox{% endblock %} — centrAlign</title>
  <style>
    :root {
      --bg: #090d16;
      --sidebar: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #030712;
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1300px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: var(--accent); }
    
    /* Dev Control Bar */
    .dev-control-bar {
      background: #022c22;
      border-bottom: 1px solid #065f46;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      color: #a7f3d0;
    }
    .dev-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .dev-badge {
      background: #059669;
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
    }
    .dev-controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .app-layout {
      display: flex;
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      gap: 1.5rem;
    }
    .sidebar {
      width: 240px;
      background: var(--sidebar);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      height: fit-content;
    }
    .sidebar a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
    }
    .sidebar-count {
      background: #334155;
      color: #fff;
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      border-radius: 9999px;
    }
    .main-view {
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--card-border); }
    th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-attachment { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    input, textarea, select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="top-bar">
      <a href="/inbox" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        centrAlign <span>Email Sandbox</span>
      </a>
      <span style="color:var(--text-muted); font-size:0.85rem;">🔒 Isolated Local Sandbox — No External Mail Delivery</span>
    </div>
  </header>

  <div class="dev-control-bar">
    <div class="dev-container">
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <span class="dev-badge">Email Sandbox Server</span>
        <span>Port 8002 | Isolated Sandbox Mode</span>
      </div>
      <div class="dev-controls">
        <div style="display:flex; align-items:center; gap:0.4rem;">
          <span>Fault Mode:</span>
          <select id="email-fault-select" onchange="updateEmailFaultMode(this.value)" style="width:auto; padding:0.2rem 0.5rem; font-size:0.8rem;">
            <option value="none" {% if fault_mode == 'none' %}selected{% endif %}>None (Normal)</option>
            <option value="fail_before_send" {% if fault_mode == 'fail_before_send' %}selected{% endif %}>Fail Before Send (HTTP 500)</option>
            <option value="fail_after_send" {% if fault_mode == 'fail_after_send' %}selected{% endif %}>Fail After Send (HTTP 504)</option>
            <option value="timeout" {% if fault_mode == 'timeout' %}selected{% endif %}>Timeout (15s delay)</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="resetEmailSeedData()" style="padding:0.2rem 0.5rem; font-size:0.75rem;">Reset Mailbox</button>
      </div>
    </div>
  </div>

  <div class="app-layout">
    <div class="sidebar">
      <a href="/compose" class="btn btn-primary" id="btn-compose-email" style="margin-bottom:0.5rem; color:#0f172a;">✏️ Compose</a>
      <a href="/inbox" id="nav-inbox" class="{% if active_folder == 'inbox' %}active{% endif %}">
        <span>📥 Inbox</span>
        <span class="sidebar-count" id="inbox-count">{{ inbox_count or 0 }}</span>
      </a>
      <a href="/outbox" id="nav-outbox" class="{% if active_folder == 'outbox' %}active{% endif %}">
        <span>📤 Sent / Outbox</span>
        <span class="sidebar-count" id="outbox-count">{{ outbox_count or 0 }}</span>
      </a>
    </div>

    <div class="main-view">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script>
    async function updateEmailFaultMode(mode) {
      await fetch('/api/set-fault-mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode })
      });
    }
    async function resetEmailSeedData() {
      if (confirm('Reset mailbox to initial seed state?')) {
        await fetch('/api/reset-data', { method: 'POST' });
        window.location.reload();
      }
    }
  </script>
</body>
</html>
